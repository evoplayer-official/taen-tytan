<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TA'EN TYTAN</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Liberation Sans', sans-serif;
    background: #1a1a1a;
    color: #e0ddd5;
    line-height: 1.6;
  }

  /* ===== TEMPESTA: i fulmini vengono disegnati qui, dietro ai contenuti ===== */
  #tempesta {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 60px 24px;
  }

  /* ===== TITOLO: oro texturizzato + riflesso di luce che scorre ogni tanto ===== */
  h1.oro-texturizzato {
    font-family: 'Cinzel', serif;
    font-size: clamp(2.8rem, 7vw, 4.8rem);
    font-weight: 900;
    letter-spacing: 0.15em;
    text-align: center;
    margin-bottom: 12px;
    line-height: 1.1;
    background-image:
      linear-gradient(105deg, transparent 44%, rgba(255, 250, 232, 0.95) 50%, transparent 56%),
      url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.28'/%3E%3C/svg%3E"),
      linear-gradient(135deg, #7A5C29 0%, #DFC88E 25%, #9E7B38 50%, #F2E2B6 75%, #6B4F1D 100%);
    background-size: 250% 100%, auto, auto;
    background-repeat: no-repeat, repeat, no-repeat;
    background-position: 100% 0, 0 0, 0 0;
    background-blend-mode: normal, overlay, overlay;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0px 4px 5px rgba(0, 0, 0, 0.85));
    transition: filter 0.25s ease-out;
    animation: riflessoTitolo 12s ease-in-out 5s infinite;
  }
  /* il riflesso attraversa le lettere in circa 1,7 secondi, poi il titolo resta fermo */
  @keyframes riflessoTitolo {
    0%   { background-position: 100% 0, 0 0, 0 0; }
    14%  { background-position: 0% 0, 0 0, 0 0; }
    100% { background-position: 0% 0, 0 0, 0 0; }
  }
  /* quando cade un fulmine il titolo si illumina di luce fredda */
  h1.oro-texturizzato.colpo {
    filter: drop-shadow(0 0 18px rgba(190, 215, 255, 0.75)) drop-shadow(0px 4px 5px rgba(0, 0, 0, 0.85));
    transition: filter 0.05s linear;
  }
  .tagline {
    text-align: center;
    font-size: 1rem;
    color: #8a8578;
    margin-bottom: 48px;
    font-style: italic;
  }
  .quote {
    text-align: center;
    font-size: 1.1rem;
    color: #b0aa9a;
    max-width: 600px;
    margin: 0 auto 48px;
    line-height: 1.8;
  }

  /* ===== VIDEO ===== */
  .video-wrap {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%;
    margin-bottom: 60px;
    border-radius: 4px;
    overflow: hidden;
    background: #111;
    border: 1px solid rgba(223, 200, 142, 0.22);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    transition: box-shadow 0.4s ease, border-color 0.4s ease;
  }
  .video-wrap:hover {
    border-color: rgba(223, 200, 142, 0.5);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(223, 200, 142, 0.12);
  }
  .video-wrap iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: none;
  }

  /* ===== PLAY: sigillo dorato che crepita ===== */
  .play-btn {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: none;
    cursor: pointer;
    overflow: hidden;
    background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), #3a342a 0%, #141210 65%);
    color: #DFC88E;
    font-size: 3rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .play-btn:hover {
    background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), #4a4132 0%, #141210 65%);
  }
  .play-btn:focus-visible {
    outline: 2px solid #F2E2B6;
    outline-offset: -6px;
  }

  /* vignettatura ai bordi */
  .play-btn::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, 0.65) 100%);
  }
  /* anello tratteggiato che ruota lento */
  .play-btn::before {
    content: "";
    position: absolute;
    top: 50%; left: 50%;
    width: 140px; height: 140px;
    margin: -70px 0 0 -70px;
    border: 1px dashed rgba(223, 200, 142, 0.35);
    border-radius: 50%;
    animation: gira 24s linear infinite;
    transition: border-color 0.3s ease;
  }
  .play-btn:hover::before { border-color: rgba(205, 225, 255, 0.85); }
  @keyframes gira { to { transform: rotate(360deg); } }

  .play-btn span {
    position: relative;
    z-index: 1;
    width: 100px; height: 100px;
    padding: 0;
    font-size: 0;
    border: 2px solid #DFC88E;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 35% 30%, rgba(242, 226, 182, 0.28), rgba(20, 18, 16, 0.7) 70%);
    box-shadow:
      0 0 0 6px rgba(223, 200, 142, 0.08),
      0 12px 30px rgba(0, 0, 0, 0.7),
      0 0 28px rgba(223, 200, 142, 0.22),
      inset 0 2px 6px rgba(255, 240, 200, 0.3),
      inset 0 -8px 16px rgba(0, 0, 0, 0.6);
    transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.3), box-shadow 0.35s ease;
  }
  /* triangolo disegnato in oro */
  .play-btn span::before {
    content: "";
    width: 34px; height: 40px;
    margin-left: 7px;
    background: linear-gradient(135deg, #F2E2B6, #9E7B38);
    clip-path: polygon(0 0, 100% 50%, 0 100%);
    transition: transform 0.35s ease;
  }
  /* anello pulsante */
  .play-btn span::after {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    border: 2px solid #DFC88E;
    animation: onda 2.4s ease-out infinite;
  }
  @keyframes onda {
    0%   { transform: scale(1);   opacity: 0.7; }
    100% { transform: scale(1.7); opacity: 0; }
  }

  /* al passaggio del mouse: sale e crepita, con scariche di luce fredda irregolari */
  .play-btn:hover span {
    transform: scale(1.14) translateY(-5px);
    border-color: #F2E2B6;
    animation: crepita 1.7s steps(1, end) infinite;
  }
  .play-btn:hover span::after { border-color: #dbe9ff; }
  .play-btn:hover span::before { transform: scale(1.12); }
  .play-btn:active span { transform: scale(0.95); }

  @keyframes crepita {
    0%, 100% {
      box-shadow: 0 0 0 8px rgba(223, 200, 142, 0.14), 0 22px 44px rgba(0, 0, 0, 0.75),
                  0 0 50px rgba(223, 200, 142, 0.5), inset 0 2px 6px rgba(255, 245, 215, 0.5),
                  inset 0 -8px 16px rgba(0, 0, 0, 0.5);
    }
    12% {
      box-shadow: 0 0 0 8px rgba(190, 215, 255, 0.28), 0 22px 44px rgba(0, 0, 0, 0.75),
                  0 0 60px rgba(170, 200, 255, 0.85), inset 0 2px 8px rgba(235, 245, 255, 0.7),
                  inset 0 -8px 16px rgba(0, 0, 0, 0.5);
    }
    16% {
      box-shadow: 0 0 0 8px rgba(223, 200, 142, 0.14), 0 22px 44px rgba(0, 0, 0, 0.75),
                  0 0 40px rgba(223, 200, 142, 0.4), inset 0 2px 6px rgba(255, 245, 215, 0.4),
                  inset 0 -8px 16px rgba(0, 0, 0, 0.5);
    }
    19% {
      box-shadow: 0 0 0 8px rgba(190, 215, 255, 0.22), 0 22px 44px rgba(0, 0, 0, 0.75),
                  0 0 56px rgba(170, 200, 255, 0.7), inset 0 2px 8px rgba(235, 245, 255, 0.6),
                  inset 0 -8px 16px rgba(0, 0, 0, 0.5);
    }
    24% {
      box-shadow: 0 0 0 8px rgba(223, 200, 142, 0.14), 0 22px 44px rgba(0, 0, 0, 0.75),
                  0 0 50px rgba(223, 200, 142, 0.5), inset 0 2px 6px rgba(255, 245, 215, 0.5),
                  inset 0 -8px 16px rgba(0, 0, 0, 0.5);
    }
    63% {
      box-shadow: 0 0 0 8px rgba(190, 215, 255, 0.3), 0 22px 44px rgba(0, 0, 0, 0.75),
                  0 0 64px rgba(170, 200, 255, 0.9), inset 0 2px 8px rgba(235, 245, 255, 0.75),
                  inset 0 -8px 16px rgba(0, 0, 0, 0.5);
    }
    67% {
      box-shadow: 0 0 0 8px rgba(223, 200, 142, 0.14), 0 22px 44px rgba(0, 0, 0, 0.75),
                  0 0 46px rgba(223, 200, 142, 0.45), inset 0 2px 6px rgba(255, 245, 215, 0.45),
                  inset 0 -8px 16px rgba(0, 0, 0, 0.5);
    }
  }

  /* ===== GALLERIA "IL MONDO" ===== */
  .section-title {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: #6a6558;
    margin-bottom: 20px;
    text-align: center;
  }
  .gallery-sub {
    text-align: center;
    font-size: 0.85rem;
    color: #6a6558;
    margin-top: -10px;
    margin-bottom: 24px;
    font-style: italic;
  }
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 14px;
    margin-bottom: 60px;
  }

  .card {
    display: block;
    width: 100%;
    padding: 0;
    font: inherit;
    color: inherit;
    text-align: left;
    background: #1f1f1f;
    border: 1px solid rgba(223, 200, 142, 0.14);
    border-radius: 4px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(223, 200, 142, 0.5);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55), 0 0 24px rgba(223, 200, 142, 0.1);
  }
  .card:focus-visible {
    outline: 2px solid #F2E2B6;
    outline-offset: 3px;
  }
  .card .thumb {
    display: block;
    position: relative;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: #252525;
  }
  .card .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.7s ease;
  }
  .card:hover .thumb img { transform: scale(1.05); }

  .card .info {
    display: block;
    padding: 12px 14px 16px;
  }
  .card .badge {
    display: inline-block;
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    padding: 2px 8px;
    border: 1px solid rgba(223, 200, 142, 0.45);
    border-radius: 2px;
    color: #DFC88E;
  }
  .card .badge.finito {
    background: #DFC88E;
    border-color: #DFC88E;
    color: #1a1a1a;
    font-weight: 700;
  }
  .card .badge.prossimamente {
    border-color: #3a3a3a;
    color: #5a564c;
  }
  .card .data {
    float: right;
    font-size: 0.72rem;
    color: #6a6558;
    padding-top: 3px;
  }
  .card .tit {
    display: block;
    clear: both;
    font-family: 'Cinzel', serif;
    font-weight: 800;
    font-size: 0.98rem;
    letter-spacing: 0.06em;
    color: #DFC88E;
    margin: 9px 0 4px;
  }
  .card .desc {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-size: 0.82rem;
    line-height: 1.5;
    color: #8a8578;
  }

  /* riquadri ancora vuoti */
  .card.vuoto { cursor: default; }
  .card.vuoto:hover { transform: none; border-color: rgba(223, 200, 142, 0.14); box-shadow: none; }
  .card.vuoto .thumb::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 32px; height: 32px;
    border: 1px solid #3a3a3a;
    border-radius: 50%;
  }
  .card.vuoto .thumb::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(110deg, transparent 30%, rgba(223, 200, 142, 0.1) 50%, transparent 70%);
    transform: translateX(-100%);
    animation: riflesso 3.5s ease-in-out infinite;
  }
  @keyframes riflesso { to { transform: translateX(100%); } }

  /* ===== INGRANDIMENTO AL CLIC ===== */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(8, 8, 8, 0.93);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    align-items: center;
    justify-content: center;
    padding: 56px 16px 24px;
  }
  .lightbox.aperta {
    display: flex;
    animation: appari 0.3s ease-out;
  }
  @keyframes appari { from { opacity: 0; } to { opacity: 1; } }

  .lb-fig {
    max-width: 1100px;
    width: 100%;
    text-align: center;
  }
  .lb-fig img {
    max-width: 100%;
    max-height: 70vh;
    border: 1px solid rgba(223, 200, 142, 0.35);
    border-radius: 3px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(223, 200, 142, 0.12);
    background: #111;
  }
  .lb-fig figcaption { margin: 18px auto 0; max-width: 640px; }
  .lb-fig .lb-tit {
    display: block;
    font-family: 'Cinzel', serif;
    font-weight: 800;
    font-size: 1.15rem;
    letter-spacing: 0.08em;
    color: #DFC88E;
  }
  .lb-fig .lb-meta {
    display: block;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: #6a6558;
    margin: 4px 0 8px;
  }
  .lb-fig .lb-desc {
    display: block;
    font-size: 0.92rem;
    color: #b0aa9a;
    line-height: 1.6;
  }

  .lb-btn {
    position: absolute;
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 1px solid rgba(223, 200, 142, 0.5);
    background: rgba(26, 26, 26, 0.7);
    color: #DFC88E;
    font-size: 1.7rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .lb-btn:hover {
    color: #F2E2B6;
    border-color: rgba(242, 226, 182, 0.9);
    box-shadow: 0 0 20px rgba(223, 200, 142, 0.4);
  }
  .lb-btn:focus-visible { outline: 2px solid #F2E2B6; outline-offset: 3px; }
  .lb-chiudi { top: 14px; right: 14px; }
  .lb-prev { left: 14px; top: 50%; margin-top: -24px; }
  .lb-next { right: 14px; top: 50%; margin-top: -24px; }
  .lightbox.singola .lb-prev,
  .lightbox.singola .lb-next { display: none; }

  @media (max-width: 700px) {
    .lb-prev, .lb-next { top: auto; bottom: 14px; margin-top: 0; }
    .lb-prev { left: 14px; }
    .lb-next { right: 14px; }
    .lb-fig img { max-height: 55vh; }
  }

  /* ===== CONTATTI ===== */
  .contatti {
    text-align: center;
    margin-bottom: 60px;
  }
  .contatti p {
    color: #b0aa9a;
    margin-bottom: 14px;
  }
  .mail-link {
    display: inline-block;
    font-family: 'Cinzel', serif;
    font-weight: 800;
    font-size: 1.15rem;
    letter-spacing: 0.1em;
    color: #DFC88E;
    text-decoration: none;
    padding-bottom: 3px;
    border-bottom: 1px solid rgba(223, 200, 142, 0.35);
    transition: color 0.3s ease, border-color 0.3s ease, text-shadow 0.3s ease;
  }
  .mail-link:hover {
    color: #F2E2B6;
    border-color: rgba(242, 226, 182, 0.85);
    text-shadow: 0 0 16px rgba(223, 200, 142, 0.55);
  }
  .mail-link:focus-visible {
    outline: 2px solid #F2E2B6;
    outline-offset: 6px;
  }

  .footer {
    text-align: center;
    font-size: 0.8rem;
    color: #4a4840;
    padding-top: 20px;
    border-top: 1px solid #2a2a2a;
  }

  @media (prefers-reduced-motion: reduce) {
    h1.oro-texturizzato { animation: none; }
    .play-btn::before,
    .play-btn span::after,
    .card.vuoto .thumb::before { animation: none; }
    .play-btn:hover span { animation: none; }
    .lightbox.aperta { animation: none; }
    .play-btn span, .play-btn span::before, .card, .card .thumb img, .mail-link { transition: none; }
  }
</style>
</head>
<body>

<canvas id="tempesta" aria-hidden="true"></canvas>

<div class="container">

  <h1 class="oro-texturizzato">TA'EN TYTAN</h1>

  <p class="tagline">Un videogioco in costruzione</p>

  <p class="quote">«La cosa più grande della tua vita non si lascia guardare intera, eppure ci stai dentro.»</p>

  <div class="video-wrap" id="box1">
    <button class="play-btn" aria-label="Riproduci il video" onclick="apriVideo('box1','https://peertube.uno/w/f33ESe1NpJXN7fft5hr1mS')"><span>▶</span></button>
  </div>

  <div class="video-wrap" id="box2">
    <button class="play-btn" aria-label="Riproduci il video" onclick="apriVideo('box2','https://peertube.uno/w/hAhRX1ML9RGQgVaSBXuV3s')"><span>▶</span></button>
  </div>

  <p class="section-title">Il mondo</p>
  <p class="gallery-sub">Lavori in corso · ultimo aggiornamento: <span id="aggiornamento"></span></p>
  <div class="gallery" id="galleria"></div>

  <p class="section-title">Contatti</p>
  <div class="contatti">
    <p>Domande, idee o collaborazioni? Scrivimi.</p>
    <a id="mail" class="mail-link" href="#">Scrivi un messaggio</a>
    <noscript><p>info [chiocciola] taen.games</p></noscript>
  </div>

  <div class="footer">
    <p>taen.games</p>
  </div>

</div>

<!-- Finestra con la foto ingrandita -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Foto ingrandita">
  <button class="lb-btn lb-chiudi" id="lb-chiudi" aria-label="Chiudi">&times;</button>
  <button class="lb-btn lb-prev" id="lb-prev" aria-label="Foto precedente">&#8249;</button>
  <figure class="lb-fig">
    <img id="lb-img" src="" alt="">
    <figcaption>
      <span class="lb-tit" id="lb-tit"></span>
      <span class="lb-meta" id="lb-meta"></span>
      <span class="lb-desc" id="lb-desc"></span>
    </figcaption>
  </figure>
  <button class="lb-btn lb-next" id="lb-next" aria-label="Foto successiva">&#8250;</button>
</div>

<script>
  /* =====================================================================
     SCHEDA DELLE FOTO  -  QUI SI AGGIORNA LA GALLERIA
     Ogni riquadro ha: file, titolo, descrizione, data, stato.
       file   = nome del file WebP caricato su GitHub (vuoto '' = riquadro libero)
       stato  = 'lavorazione'  oppure  'finito'
     ===================================================================== */
  var AGGIORNATO = '15 novembre 2026';

  var FOTO = [
    {
      file: 'foto-01.webp',
      titolo: 'La valle',
      descrizione: 'Una capanna dal tetto di paglia sulla riva del lago, ai piedi della rupe. Scena ancora in costruzione.',
      data: '15 nov 2026',
      stato: 'lavorazione'
    },
    {
      file: 'foto-02.webp',
      titolo: 'Il pontile sul lago',
      descrizione: 'Una piattaforma circolare di legno sull\'acqua, collegata alla riva da un pontile. A sinistra, una trave con corde e carrucola.',
      data: '15 nov 2026',
      stato: 'lavorazione'
    },
    {
      file: 'foto-03.webp',
      titolo: 'L\'occhio del lago',
      descrizione: 'Il cuore della piattaforma: passerelle di legno attorno all\'acqua, una lanterna di carta appesa e un disco di pietra al centro.',
      data: '15 nov 2026',
      stato: 'lavorazione'
    },
    {
      file: 'foto-04.webp',
      titolo: 'Il cancello',
      descrizione: 'Dettaglio del cancelletto di assi e delle panche di legno lavorato, con i pali che si specchiano nell\'acqua.',
      data: '15 nov 2026',
      stato: 'lavorazione'
    },
    {
      file: 'foto-05.webp',
      titolo: 'Il passaggio',
      descrizione: 'Il cancello visto di fronte, con la roccia a lato. Sullo sfondo si intravede una costruzione dal tetto di paglia.',
      data: '15 nov 2026',
      stato: 'lavorazione'
    },
    {
      file: 'foto-06.webp',
      titolo: 'Dentro l\'anello',
      descrizione: 'La passerella vista da vicino: pali e travi legati con corde, la lanterna sospesa e il disco di pietra sull\'acqua.',
      data: '15 nov 2026',
      stato: 'lavorazione'
    }
  ];
  /* ===================================================================== */

  var URL1 = 'https://peertube.uno/w/f33ESe1NpJXN7fft5hr1mS';
  var URL2 = 'https://peertube.uno/w/hAhRX1ML9RGQgVaSBXuV3s';

  function chiudi(id) {
    var box = document.getElementById(id);
    var f = box.querySelector('iframe');
    if (f) {
      box.innerHTML = '';
      var b = document.createElement('button');
      b.className = 'play-btn';
      b.setAttribute('aria-label', 'Riproduci il video');
      b.innerHTML = '<span>▶</span>';
      b.onclick = function(){ apriVideo(id, id === 'box1' ? URL1 : URL2); };
      box.appendChild(b);
    }
  }

  function apriVideo(id, url) {
    if (window.fulmine) window.fulmine();   /* un fulmine quando premi play */
    chiudi(id === 'box1' ? 'box2' : 'box1');
    var box = document.getElementById(id);
    box.innerHTML = '';
    var f = document.createElement('iframe');
    f.src = url;
    f.setAttribute('allowfullscreen', '');
    box.appendChild(f);
  }

  /* effetto torcia: la luce calda segue il mouse sul play */
  document.addEventListener('mousemove', function (e) {
    var b = e.target.closest && e.target.closest('.play-btn');
    if (!b) return;
    var r = b.getBoundingClientRect();
    b.style.setProperty('--x', (e.clientX - r.left) + 'px');
    b.style.setProperty('--y', (e.clientY - r.top) + 'px');
  });

  /* ===== GALLERIA E INGRANDIMENTO ===== */
  (function () {
    var galleria = document.getElementById('galleria');
    var lb = document.getElementById('lightbox');
    var lbImg = document.getElementById('lb-img');
    var lbTit = document.getElementById('lb-tit');
    var lbMeta = document.getElementById('lb-meta');
    var lbDesc = document.getElementById('lb-desc');
    var agg = document.getElementById('aggiornamento');
    if (!galleria) return;
    if (agg) agg.textContent = AGGIORNATO;

    function el(tag, classe, testo) {
      var e = document.createElement(tag);
      if (classe) e.className = classe;
      if (testo) e.textContent = testo;
      return e;
    }
    function etichetta(stato) {
      return stato === 'finito' ? 'Finito' : 'In lavorazione';
    }

    /* elenco delle sole foto presenti, per scorrere avanti e indietro */
    var piene = [];
    FOTO.forEach(function (f, i) { if (f.file) piene.push(i); });

    FOTO.forEach(function (f, i) {
      var c, thumb, info;
      if (f.file) {
        c = el('button', 'card');
        c.type = 'button';
        c.setAttribute('aria-label', 'Ingrandisci: ' + (f.titolo || 'foto'));
        thumb = el('span', 'thumb');
        var img = document.createElement('img');
        img.src = f.file;
        img.alt = (f.titolo ? f.titolo + '. ' : '') + (f.descrizione || '');
        img.loading = 'lazy';
        thumb.appendChild(img);
        info = el('span', 'info');
        info.appendChild(el('span', 'badge ' + (f.stato === 'finito' ? 'finito' : ''), etichetta(f.stato)));
        if (f.data) info.appendChild(el('span', 'data', f.data));
        if (f.titolo) info.appendChild(el('span', 'tit', f.titolo));
        if (f.descrizione) info.appendChild(el('span', 'desc', f.descrizione));
        c.appendChild(thumb);
        c.appendChild(info);
        c.addEventListener('click', function () { apri(piene.indexOf(i), c); });
      } else {
        c = el('div', 'card vuoto');
        thumb = el('span', 'thumb');
        info = el('span', 'info');
        info.appendChild(el('span', 'badge prossimamente', 'Prossimamente'));
        c.appendChild(thumb);
        c.appendChild(info);
      }
      galleria.appendChild(c);
    });

    /* ----- finestra con foto ingrandita ----- */
    var corrente = 0;
    var apritore = null;

    function mostra(n) {
      if (!piene.length) return;
      corrente = (n + piene.length) % piene.length;
      var f = FOTO[piene[corrente]];
      lbImg.src = f.file;
      lbImg.alt = (f.titolo ? f.titolo + '. ' : '') + (f.descrizione || '');
      lbTit.textContent = f.titolo || '';
      lbMeta.textContent = etichetta(f.stato) + (f.data ? '  ·  ' + f.data : '');
      lbDesc.textContent = f.descrizione || '';
    }
    function apri(n, daChi) {
      apritore = daChi || null;
      lb.classList.toggle('singola', piene.length < 2);
      mostra(n);
      lb.classList.add('aperta');
      document.body.style.overflow = 'hidden';
      document.getElementById('lb-chiudi').focus();
    }
    function chiudiLb() {
      lb.classList.remove('aperta');
      document.body.style.overflow = '';
      if (apritore && apritore.focus) apritore.focus();
    }

    document.getElementById('lb-chiudi').addEventListener('click', chiudiLb);
    document.getElementById('lb-prev').addEventListener('click', function () { mostra(corrente - 1); });
    document.getElementById('lb-next').addEventListener('click', function () { mostra(corrente + 1); });
    lb.addEventListener('click', function (e) { if (e.target === lb) chiudiLb(); });

    document.addEventListener('keydown', function (e) {
      if (!lb.classList.contains('aperta')) return;
      if (e.key === 'Escape') chiudiLb();
      else if (e.key === 'ArrowLeft') mostra(corrente - 1);
      else if (e.key === 'ArrowRight') mostra(corrente + 1);
    });

    /* scorrimento con il dito su telefono */
    var x0 = null;
    lb.addEventListener('touchstart', function (e) { x0 = e.changedTouches[0].clientX; }, { passive: true });
    lb.addEventListener('touchend', function (e) {
      if (x0 === null) return;
      var dx = e.changedTouches[0].clientX - x0;
      x0 = null;
      if (Math.abs(dx) > 50) mostra(corrente + (dx < 0 ? 1 : -1));
    }, { passive: true });
  })();

  /* contatto email: l'indirizzo viene composto qui, così i programmi che
     raccolgono indirizzi dalle pagine (spam) fanno più fatica a trovarlo */
  (function () {
    var a = document.getElementById('mail');
    if (!a) return;
    var utente = 'info';
    var dominio = 'taen.games';
    var indirizzo = utente + '@' + dominio;
    a.href = 'mailto:' + indirizzo;
    a.textContent = indirizzo;
  })();

  /* ===== TEMPESTA ===== */
  (function () {
    var cv = document.getElementById('tempesta');
    var titolo = document.querySelector('h1.oro-texturizzato');
    var ridotto = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (!cv || !cv.getContext || ridotto) { window.fulmine = function () {}; return; }

    var ctx = cv.getContext('2d');
    var W = 0, H = 0;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var inCorso = false;

    function misura() {
      W = window.innerWidth;
      H = window.innerHeight;
      cv.width = W * dpr;
      cv.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    misura();
    window.addEventListener('resize', misura);

    /* percorso a zig-zag tra due punti (spostamento del punto medio) */
    function zigzag(a, b, spost) {
      if (spost < 4) return [a];
      var m = [
        (a[0] + b[0]) / 2 + (Math.random() - 0.5) * spost,
        (a[1] + b[1]) / 2 + (Math.random() - 0.5) * spost * 0.3
      ];
      return zigzag(a, m, spost / 2).concat(zigzag(m, b, spost / 2));
    }

    function creaFulmine() {
      var x0 = W * (0.08 + Math.random() * 0.84);
      var inizio = [x0, -10];
      var fine = [x0 + (Math.random() - 0.5) * W * 0.25, H * (0.5 + Math.random() * 0.4)];
      var principale = zigzag(inizio, fine, 150).concat([fine]);
      var rami = [{ pts: principale, w: 2.6 }];

      var n = 2 + Math.floor(Math.random() * 3);
      for (var i = 0; i < n; i++) {
        var k = 4 + Math.floor(Math.random() * (principale.length - 6));
        var p = principale[k];
        var verso = Math.random() < 0.5 ? -1 : 1;
        var fineRamo = [
          p[0] + verso * (60 + Math.random() * 160),
          p[1] + 100 + Math.random() * 180
        ];
        rami.push({ pts: zigzag(p, fineRamo, 70).concat([fineRamo]), w: 1.3 });
      }
      return rami;
    }

    function disegna(rami, a) {
      ctx.clearRect(0, 0, W, H);
      /* bagliore sul cielo */
      ctx.fillStyle = 'rgba(190, 210, 255,' + (a * 0.07) + ')';
      ctx.fillRect(0, 0, W, H);

      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      rami.forEach(function (r) {
        ctx.beginPath();
        r.pts.forEach(function (p, i) {
          if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
        });
        /* alone azzurro */
        ctx.save();
        ctx.shadowColor = 'rgba(150, 180, 255, 1)';
        ctx.shadowBlur = 26;
        ctx.strokeStyle = 'rgba(150, 180, 255,' + (a * 0.55) + ')';
        ctx.lineWidth = r.w * 4.5;
        ctx.stroke();
        ctx.restore();
        /* nucleo bianco */
        ctx.save();
        ctx.shadowColor = 'rgba(210, 225, 255, 1)';
        ctx.shadowBlur = 8;
        ctx.strokeStyle = 'rgba(255, 255, 255,' + a + ')';
        ctx.lineWidth = r.w;
        ctx.stroke();
        ctx.restore();
      });
    }

    /* intensità nel tempo: colpo, sfarfallio, secondo colpo, dissolvenza */
    var sequenza = [[0, 1], [70, 0.12], [120, 0.95], [210, 0.45], [300, 0.7], [650, 0]];

    function intensita(t) {
      for (var i = 1; i < sequenza.length; i++) {
        if (t <= sequenza[i][0]) {
          var t0 = sequenza[i - 1][0], a0 = sequenza[i - 1][1];
          var t1 = sequenza[i][0],     a1 = sequenza[i][1];
          return a0 + (a1 - a0) * ((t - t0) / (t1 - t0));
        }
      }
      return 0;
    }

    function colpisci() {
      if (inCorso) return;
      inCorso = true;
      var rami = creaFulmine();
      var t0 = performance.now();
      var durata = sequenza[sequenza.length - 1][0];

      if (titolo) {
        titolo.classList.add('colpo');
        setTimeout(function () { titolo.classList.remove('colpo'); }, 320);
      }

      function frame(ora) {
        var t = ora - t0;
        if (t >= durata) {
          ctx.clearRect(0, 0, W, H);
          inCorso = false;
          return;
        }
        disegna(rami, intensita(t));
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    window.fulmine = colpisci;

    /* il primo fulmine all'apertura, poi a intervalli irregolari */
    function prossimo() {
      setTimeout(function () {
        if (!document.hidden) colpisci();
        prossimo();
      }, 9000 + Math.random() * 10000);
    }
    setTimeout(function () { colpisci(); prossimo(); }, 2200);
  })();
</script>
